{{- if and .Values.broker.secret (not .Values.broker.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "webstation.fullname" . }}-broker
  labels:
    {{- include "webstation.labels" . | nindent 4 }}
type: Opaque
stringData:
  BROKER_SECRET: {{ .Values.broker.secret | quote }}
{{- end }}
